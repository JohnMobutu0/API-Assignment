{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href={% static 'products/style_a.css' %} />
</head>
<body>

  <div class="category">
        <h1>Categories</h1>
        <a href="{% url 'products:product_list' %}">View Products</a><br><br>
    <a href="{% url 'products:add_category' %}">Add New Category</a>

    <ul>
      {% for category in categories %}
        <li>
          <strong>{{ category }}</strong>
        </li>
      {% empty %}
        <li>No categories yet.</li>
      {% endfor %}
    </ul>
    

</div>

</body>
</html>
